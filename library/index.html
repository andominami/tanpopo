<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>図書室 蔵書検索・貸出状況</title>
<meta name="description" content="院内図書室の本を一覧・検索でき、貸出日と借りた人がわかるサイト">
<link rel="icon" type="image/png" href="../assets/logo-tanpopo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#/">
      <img class="brand-mark" src="../assets/logo-tanpopo.png" alt="" aria-hidden="true">
      <span class="brand-text">
        <span class="brand-title">図書室 蔵書検索</span>
      </span>
    </a>
    <div class="search-wrap">
      <label class="sr-only" for="search-input">キーワード検索</label>
      <input id="search-input" type="search" autocomplete="off"
             placeholder="書名・著者・カテゴリで検索">
      <button id="search-clear" type="button" aria-label="検索をクリア">&times;</button>
    </div>
    <a class="back-link" href="../index.html">保険算定ルールノートへ</a>
  </div>
</header>

<main class="layout">
  <aside class="sidebar" id="sidebar">
    <h2 class="sidebar-title">カテゴリ</h2>
    <ul id="category-list" class="category-list"></ul>
  </aside>

  <section class="content">
    <div class="content-toolbar">
      <p id="result-count" class="result-count" role="status" aria-live="polite"></p>
      <div class="toolbar-controls">
        <label class="status-filter-label">
          貸出状況
          <select id="status-select">
            <option value="all">すべて</option>
            <option value="available">在架のみ</option>
            <option value="borrowed">貸出中のみ</option>
          </select>
        </label>
        <label class="sort-label">
          並び替え
          <select id="sort-select">
            <option value="no-asc">No.順</option>
            <option value="title-asc">書名順</option>
            <option value="loan-desc">貸出日が新しい順</option>
          </select>
        </label>
      </div>
    </div>

    <ul id="book-list" class="book-list"></ul>

    <p id="empty-state" class="empty-state" hidden>
      該当する本が見つかりませんでした。別のキーワードで検索してください。
    </p>
  </section>
</main>

<div id="detail-overlay" class="detail-overlay" hidden>
  <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <button id="detail-close" class="detail-close" type="button" aria-label="閉じる">&times;</button>
    <div id="detail-body" class="detail-body"></div>
  </div>
</div>

<footer class="site-footer">
  <p>院内図書室 蔵書検索サイト &mdash; データは <code>library/data/books.json</code> を編集して更新できます。</p>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
